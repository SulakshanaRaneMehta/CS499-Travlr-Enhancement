<div class="card">
    <div class="card-header">{{ trip.name }}</div>
    <img [src]="'assets/images/' + trip.image" [alt]="trip.name + ' at ' + trip.resort" class="card-img-top">
    <div class="card-body">
        <h6 class="card-subtitle mb-2 text-muted">
            {{ trip.resort }}
        </h6>
        <p class="card-subtitle mt-3 mb-3 text-muted">
            {{ trip.length }} only {{ formatPrice(trip.perPerson) }} per person
        </p>
        <p class="card-text">{{ trip.description | plainText }}</p>
        <div *ngIf="isLoggedIn$ | async">
            <button type="button" (click)="editTrip(trip)" class="btn btn-info">Edit Trip</button>
        </div>
    </div>
</div>
