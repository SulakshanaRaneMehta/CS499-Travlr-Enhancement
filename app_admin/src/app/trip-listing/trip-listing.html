<div *ngIf="successMessage" class="alert alert-success" role="status" aria-live="polite">
  {{ successMessage }}
</div>

<div *ngIf="errorMessage" class="alert alert-danger" role="alert" aria-live="polite">
  {{ errorMessage }}
  <button type="button" class="btn btn-sm btn-outline-danger ms-2" (click)="loadTrips()">
    Retry
  </button>
</div>

<div class="d-flex justify-content-between align-items-center mb-3">
  <h1 class="h3 mb-0">Trip Catalog</h1>
  <button
    *ngIf="isLoggedIn$ | async"
    type="button"
    (click)="addTrip()"
    class="btn btn-info">
    Add Trip
  </button>
</div>

<p *ngIf="isLoading" aria-live="polite">Loading trips...</p>

<form
  *ngIf="!isLoading && !errorMessage"
  class="catalog-controls card card-body mb-4"
  (ngSubmit)="applyFilters()"
  novalidate>
  <div class="row g-3">
    <div class="col-12 col-lg-6">
      <label for="searchTerm" class="form-label">Search catalog</label>
      <input
        id="searchTerm"
        name="searchTerm"
        type="search"
        class="form-control"
        [(ngModel)]="criteria.searchTerm"
        placeholder="Code, name, resort, or description"
        maxlength="80">
    </div>

    <div class="col-12 col-md-6 col-lg-3">
      <label for="resort" class="form-label">Resort</label>
      <select id="resort" name="resort" class="form-select" [(ngModel)]="criteria.resort">
        <option value="">All resorts</option>
        <option *ngFor="let resort of resortOptions" [value]="resort">{{ resort }}</option>
      </select>
    </div>

    <div class="col-12 col-md-6 col-lg-3">
      <label for="sortSelection" class="form-label">Sort results</label>
      <select
        id="sortSelection"
        name="sortSelection"
        class="form-select"
        [(ngModel)]="sortSelection">
        <option value="name:asc">Name A to Z</option>
        <option value="name:desc">Name Z to A</option>
        <option value="price:asc">Price low to high</option>
        <option value="price:desc">Price high to low</option>
        <option value="start:asc">Departure earliest first</option>
        <option value="start:desc">Departure latest first</option>
      </select>
    </div>

    <div class="col-6 col-lg-3">
      <label for="minPrice" class="form-label">Minimum price</label>
      <input
        id="minPrice"
        name="minPrice"
        type="number"
        class="form-control"
        [(ngModel)]="criteria.minPrice"
        min="0"
        max="100000"
        step="0.01">
    </div>

    <div class="col-6 col-lg-3">
      <label for="maxPrice" class="form-label">Maximum price</label>
      <input
        id="maxPrice"
        name="maxPrice"
        type="number"
        class="form-control"
        [(ngModel)]="criteria.maxPrice"
        min="0"
        max="100000"
        step="0.01">
    </div>

    <div class="col-6 col-lg-3">
      <label for="earliestStart" class="form-label">Earliest departure</label>
      <input
        id="earliestStart"
        name="earliestStart"
        type="date"
        class="form-control"
        [(ngModel)]="criteria.earliestStart">
    </div>

    <div class="col-6 col-lg-3">
      <label for="latestStart" class="form-label">Latest departure</label>
      <input
        id="latestStart"
        name="latestStart"
        type="date"
        class="form-control"
        [(ngModel)]="criteria.latestStart">
    </div>

    <div class="col-6 col-lg-3">
      <label for="minNights" class="form-label">Minimum nights</label>
      <input
        id="minNights"
        name="minNights"
        type="number"
        class="form-control"
        [(ngModel)]="criteria.minNights"
        min="1"
        max="365"
        step="1">
    </div>

    <div class="col-6 col-lg-3">
      <label for="maxNights" class="form-label">Maximum nights</label>
      <input
        id="maxNights"
        name="maxNights"
        type="number"
        class="form-control"
        [(ngModel)]="criteria.maxNights"
        min="1"
        max="365"
        step="1">
    </div>

    <div class="col-6 col-lg-3">
      <label for="pageSize" class="form-label">Trips per page</label>
      <select
        id="pageSize"
        name="pageSize"
        class="form-select"
        [(ngModel)]="criteria.pageSize"
        (change)="updatePageSize()">
        <option *ngFor="let size of pageSizeOptions" [ngValue]="size">{{ size }}</option>
      </select>
    </div>

    <div class="col-12 col-lg-3 d-flex align-items-end gap-2">
      <button type="submit" class="btn btn-primary flex-grow-1">Apply Filters</button>
      <button type="button" class="btn btn-outline-secondary" (click)="clearFilters()">
        Clear
      </button>
    </div>
  </div>

  <div *ngIf="filterError" class="alert alert-warning mt-3 mb-0" role="alert" aria-live="polite">
    {{ filterError }}
  </div>
</form>

<div *ngIf="!isLoading && !errorMessage" class="result-summary mb-3" aria-live="polite">
  <p class="text-muted mb-1">{{ message }}</p>
  <p *ngIf="searchDetail" class="algorithm-note mb-0">{{ searchDetail }}</p>
</div>

<div *ngIf="!isLoading && !errorMessage" class="row g-3">
  <div
    *ngFor="let trip of trips; trackBy: trackByTripCode"
    class="col-12 col-md-6 col-xl-4">
    <app-trip-card [trip]="trip" class="d-block h-100"></app-trip-card>
  </div>
</div>

<nav
  *ngIf="!isLoading && !errorMessage && pageNumbers.length > 1"
  class="mt-4"
  aria-label="Trip catalog pages">
  <ul class="pagination justify-content-center flex-wrap">
    <li class="page-item" [class.disabled]="criteria.page === 1">
      <button
        type="button"
        class="page-link"
        (click)="previousPage()"
        [disabled]="criteria.page === 1">
        Previous
      </button>
    </li>

    <li
      *ngFor="let page of pageNumbers"
      class="page-item"
      [class.active]="page === criteria.page">
      <button
        type="button"
        class="page-link"
        (click)="goToPage(page)"
        [attr.aria-current]="page === criteria.page ? 'page' : null">
        {{ page }}
      </button>
    </li>

    <li class="page-item" [class.disabled]="criteria.page === pageNumbers.length">
      <button
        type="button"
        class="page-link"
        (click)="nextPage()"
        [disabled]="criteria.page === pageNumbers.length">
        Next
      </button>
    </li>
  </ul>
</nav>
