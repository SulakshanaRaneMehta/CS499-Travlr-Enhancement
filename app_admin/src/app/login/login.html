<div class="row">
    <div class="col-12 col-md-6 mx-auto">
        <h2>Login</h2>
        <form (ngSubmit)="onLoginSubmit()" novalidate>
            <div *ngIf="formError" class="alert alert-danger" role="alert" aria-live="polite">
                {{ formError }}
            </div>

            <div class="form-group">
                <label for="email">Email Address</label>
                <input id="email" type="email" name="email" class="form-control"
                    autocomplete="username" [(ngModel)]="credentials.email" required>
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input id="password" type="password" name="password" class="form-control"
                    autocomplete="current-password" [(ngModel)]="credentials.password" required>
            </div>

            <button type="submit" class="btn btn-primary" [disabled]="isSubmitting">
                {{ isSubmitting ? 'Signing In...' : 'Sign In' }}
            </button>
        </form>
    </div>
</div>
